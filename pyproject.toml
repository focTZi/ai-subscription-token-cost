[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-costs"
version = "0.1.0"
description = "Estimate what local Codex, Claude Code and Pi usage would cost at API list prices"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
ai-costs = "ai_costs.cli:main"

[tool.setuptools]
packages = ["ai_costs"]
